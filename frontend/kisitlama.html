<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/><title>Akkan AI — Kısıtlama</title>
<link rel="stylesheet" href="assets/style.css"/>
<style>
/* Gelişmiş Ayarlar Açılır-Kapanır Stilleri */
.gelismis-ayarlar-baslik {
  width: 100%;
  background: rgba(191, 97, 106, 0.08);
  padding: 14px;
  border: none;
  text-align: left;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.2s;
}
.gelismis-ayarlar-baslik:hover {
  background: rgba(191, 97, 106, 0.15);
}
.gelismis-ayarlar-icerik {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease-out;
  background: var(--card);
}
.gelismis-ayarlar-icerik.acik {
  max-height: 2000px;
  border-top: 1px solid var(--border);
}
.dondur {
  transform: rotate(180deg);
}
/* Gelişmiş Ayarlar - Hücre Tasarımı */
.ayar-tablosu {
  display: flex;
  flex-direction: column;
  background: rgba(0, 0, 0, 0.15);
  border-radius: 8px;
  border: 1px solid var(--border);
  margin: 14px;
  overflow: hidden;
}
.ayar-tablosu-satir {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}
.ayar-tablosu-satir:last-child {
  border-bottom: none;
}
.ayar-tablosu-satir:hover {
  background: rgba(255, 255, 255, 0.05);
}
.ayar-tablosu-satir label {
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
  margin: 0;
  cursor: help;
}
.ayar-sag-alan {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 140px;
}
.ayar-sag-alan select,
.ayar-sag-alan input[type="number"] {
  width: 130px !important;
  background: var(--bg);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 10px !important;
  font-size: 11px !important;
  outline: none;
  cursor: pointer;
}
.ayar-sag-alan input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--purple);
  margin-right: 4px;
}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.govde{flex:1;display:flex;gap:14px;padding:14px;overflow:hidden}
.sol{width:290px;min-width:290px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.zform{display:flex;flex-direction:column;gap:8px}
.zrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.zrow label{margin:0;font-size:12px;color:var(--text);white-space:nowrap;font-weight:400}
.zrow input{width:78px;text-align:center;padding:5px 8px}
.saat-list{display:flex;flex-direction:column;gap:3px}
.srow{display:flex;align-items:center;gap:6px}
.sno{color:var(--green);font-weight:700;font-size:11px;width:18px;flex-shrink:0;text-align:right}
.srow input{font-size:11px;padding:4px 7px;flex:1}
.ogle-lbl{font-size:10px;color:var(--orange);font-weight:700;text-align:center;
  padding:3px 6px;background:rgba(235,203,139,.12);border-radius:4px;margin:2px 0}

/* Ekleme formu */
.ekle-form{display:flex;flex-direction:column;gap:7px}
.ekle-row{display:flex;gap:6px;align-items:flex-end}
.ekle-row input{flex:1;font-size:12px;padding:6px 9px}
.ekle-row button{flex-shrink:0}
.liste-kutu{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow-y:auto;
  border:1px solid var(--border);border-radius:var(--radius-s);padding:5px}
.liste-item{display:flex;align-items:center;justify-content:space-between;
  padding:4px 8px;border-radius:6px;font-size:11px;transition:background .1s}
.liste-item:hover{background:rgba(255,255,255,.06)}
.liste-item .isim{flex:1;color:var(--text)}
.liste-item .saat-badge{font-size:10px;color:var(--blue);font-weight:700;margin-right:6px;white-space:nowrap}
.liste-item .sil-btn{cursor:pointer;color:var(--red);font-size:14px;opacity:.7;
  transition:opacity .1s;border:none;background:none;padding:0 2px;line-height:1}
.liste-item .sil-btn:hover{opacity:1}

.sag{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.ust-bar{display:flex;gap:4px;margin-bottom:8px;flex-shrink:0;align-items:center;flex-wrap:wrap}
.sekme{padding:6px 16px;border-radius:var(--radius-s) var(--radius-s) 0 0;

  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;transition:all .15s}
.sekme.on{background:var(--card);color:var(--text)}
.arac2{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-shrink:0;flex-wrap:wrap}
.grid-wrap{flex:1;overflow:auto}
.ktbl{border-collapse:collapse;font-size:11px}
.ktbl th{background:var(--card);color:var(--blue);font-size:10px;font-weight:600;
  padding:5px 3px;text-align:center;position:sticky;top:0;z-index:10;white-space:nowrap;
  border:1px solid rgba(255,255,255,.08)}
.ktbl th.col-isim{left:0;z-index:11;text-align:left;min-width:155px;
  border-right:3px solid rgba(100,148,237,.5)!important}
.ktbl th.gun-hd{color:var(--orange);font-weight:800;background:rgba(235,203,139,.1);
  border-left:3px solid rgba(235,203,139,.5)!important}
.ktbl th.s-hd{min-width:26px;width:26px}
.isim-td{background:var(--card);color:var(--text);font-weight:600;font-size:11px;
  padding:4px 10px;text-align:left;position:sticky;left:0;white-space:nowrap;
  border-right:3px solid rgba(100,148,237,.4)!important;
  border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:background .12s}
.isim-td:hover{background:rgba(255,255,255,.07)}
.isim-td.aktif{background:rgba(142,202,230,.15)!important;color:var(--blue)}
.saat-col{font-size:9px;color:var(--green);font-weight:700;padding:0 3px;
  white-space:nowrap;min-width:30px}
.kh{width:26px;height:26px;cursor:pointer;transition:background .1s;user-select:none;
  border:1px solid rgba(255,255,255,.06)}
.kh.gun-ilk{border-left:3px solid rgba(235,203,139,.4)!important}
.kh.kap{background:rgba(191,97,106,.55)}
.kh:hover:not(.kap){background:rgba(255,255,255,.1)}
.kh.kap:hover{background:rgba(191,97,106,.75)}
.kop-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
  align-items:center;justify-content:center;z-index:200}
.kop-kutu{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;width:400px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column}
.kop-kutu h3{margin-bottom:6px}
.kop-kutu p{font-size:12px;color:var(--muted);margin-bottom:10px}
.kop-liste{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:12px;
  text-align:left!important;
}
.kop-item{
  display:flex!important;
  flex-direction:row!important;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:10px!important;
  padding:6px 8px!important;
  border-radius:6px;
  cursor:pointer;
  transition:background .12s;
  font-size:12px;
  width:100%!important;
  box-sizing:border-box!important;
  text-align:left!important;
  margin:0!important;
}
.kop-item:hover{background:rgba(255,255,255,.07)}
.kop-item input[type="checkbox"]{
  margin:0!important;
  flex-shrink:0!important;
  width:15px!important;
  height:15px!important;
  cursor:pointer;
}
.kop-item span{
  text-align:left!important;
  flex:1!important;
  white-space:nowrap!important;
}</style>
</head>

<script>
// ========== GÜVENLİK: HTML escape fonksiyonu ==========
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
    return c;
  }).replace(/['"]/g, function(m) {
    if (m === "'") return '&#39;';
    if (m === '"') return '&quot;';
    return m;
  });
}

let GUNLER=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma"];
let DERS_SAYISI=8;
let aktifSekme="ogretmen",ogretmenIzin={},sinifIzin={};
let ogretmenList=[],sinifList=[],saatEt={},ogleNo=4;
let seciliIsim=null;
let ogretmenSaatMap={},sinifSaatMap={};
let GUN_SAATLERI={};
let degisiklikVar=false;
let kilitliSlotlar={};

function degisiklikIsaretle(){ degisiklikVar=true; }
function bildir(mesaj,tip="bilgi",sure=3800){
  let wrap=document.getElementById("notif-wrap");
  if(!wrap){ wrap=document.createElement("div"); wrap.id="notif-wrap"; document.body.appendChild(wrap); }
  const ikonlar={bilgi:"ℹ️", basari:"✅", uyari:"⚠️", hata:"❌"};
  const el=document.createElement("div");
  el.className=`notif notif-${tip}`;
  el.innerHTML=`<span>${ikonlar[tip]||"ℹ️"}</span><span>${escapeHtml(mesaj)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; setTimeout(()=>el.remove(),380); },sure);
}
function onay(mesaj){
  return new Promise(res=>{
    const bg=document.createElement("div");
    bg.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999";
    bg.innerHTML=`<div style="background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:24px;max-width:380px;width:92vw;text-align:center">
      <p style="margin-bottom:20px">${escapeHtml(mesaj)}</p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-ghost btn-sm" id="onay-hayir">İptal</button>
        <button class="btn btn-red btn-sm" id="onay-evet">Onayla</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    document.getElementById("onay-evet").onclick=()=>{ bg.remove(); res(true); };
    document.getElementById("onay-hayir").onclick=()=>{ bg.remove(); res(false); };
  });
}
function git(hedef){ window.location.href=hedef; }

// Gün yönetimi (XSS korumalı)
function gunListesiCiz(){

function gunSil(idx){

      map[k]=new Set([...map[k]].filter(v=>{ const [g]=v.split("_").map(Number); return g!==idx; }).map(v=>{ const [g,s]=v.split("_").map(Number); return g>idx?`${g-1}_${s}`:v; }));

function dersSayisiDegistir(delta){
  const yeni=Math.max(1,Math.min(12,DERS_SAYISI+delta));
  if(yeni===DERS_SAYISI) return;
  if(yeni<DERS_SAYISI){
    [ogretmenIzin,sinifIzin].forEach(map=>{
      Object.keys(map).forEach(k=>{ map[k]=new Set([...map[k]].filter(v=>{ const [,s]=v.split("_").map(Number); return s<=yeni; })); });
    });
  }
  DERS_SAYISI=yeni;

}

        <button class="btn btn-green btn-sm" id="ks-evet">Evet, Kaydet</button>

      ogr.split("+").forEach(x=>{ x=x.trim(); if(!x||x==="nan") return; ogretmenSaatMap[x]=(ogretmenSaatMap[x]||0)+saat; if(ders){ if(!window._ogretmenDersMap[x]) window._ogretmenDersMap[x]=new Set(); window._ogretmenDersMap[x].add(ders); } });

function gridYenile(){
  const q=(document.getElementById("arama").value||"").toLowerCase();
  const liste=aktifSekme==="ogretmen"?ogretmenList:sinifList;
  const filtre=liste.filter(i=>i.toLowerCase().includes(q));
  const izinMap=aktifSekme==="ogretmen"?ogretmenIzin:sinifIzin;
  const saatMap=aktifSekme==="ogretmen"?ogretmenSaatMap:sinifSaatMap;

  let th = `<tr><th class="col-isim">${aktifSekme === "ogretmen" ? "Öğretmen" : "Sınıf"}</th>
      <th style="min-width:34px;background:var(--card);position:sticky;top:0;z-index:10;font-size:9px;color:var(--green);border:1px solid rgba(255,255,255,.08)">Kalan</th>`;
  GUNLER.forEach(g => th += `<th class="gun-hd" colspan="${DERS_SAYISI}">${escapeHtml(g)}</th>`);
  th += `</tr><tr><th class="col-isim"></th><th style="background:var(--card);border:1px solid rgba(255,255,255,.08)"></th>`;
  GUNLER.forEach(() => { for (let s = 1; s <= DERS_SAYISI; s++) th += `<th class="s-hd${s === 1 ? " gun-ilk" : ""}">${s}</th>`; });
  th += "</tr>";
  document.getElementById("thead").innerHTML=th;

  const tbody=document.getElementById("tbody"); tbody.innerHTML="";
  filtre.forEach(isim=>{
    const tr=document.createElement("tr");
    const ak=seciliIsim===isim?" aktif":"";
    const toplam=saatMap[isim]||0;
    let atananKilit;
    if (aktifSekme === "sinif") {
      const lockedSlotsSet = new Set();
      Object.values(kilitliSlotlar).forEach(k => {
        if (k.isim === isim && k.tip === "sinif") lockedSlotsSet.add(`${k.gun}_${k.saat}`);
        if (k.tip === "ogretmen" && k.siniflar && k.siniflar.includes(isim)) lockedSlotsSet.add(`${k.gun}_${k.saat}`);
      });
      atananKilit = lockedSlotsSet.size;
    } else {
      atananKilit = Object.values(kilitliSlotlar).filter(k => k.isim === isim && k.tip === aktifSekme).length;
    }
    const kalan = toplam - atananKilit;
    let h = `<td class="isim-td${ak}" title="${escapeHtml(isim)}" onclick="isimTikla('${isim.replace(/'/g, "\\'")}')"><span>${escapeHtml(isim)}</span></td>
         <td class="saat-col" style="background:var(--card);border:1px solid rgba(255,255,255,.06);text-align:center;color:${kalan <= 0 ? 'var(--red)' : 'var(--green)'}">${kalan} / ${toplam}</td>`;
    
    GUNLER.forEach((_,g)=>{
      for(let s=1;s<=DERS_SAYISI;s++){
        const k=`${g}_${s}`;
        const kap=(izinMap[isim]?.has(k))??false;
        const kilitKey=`${aktifSekme}:${isim}:${k}`;
        let kilitli=!!kilitliSlotlar[kilitKey];
        let kilitBilgi=kilitliSlotlar[kilitKey];

        // 1. Kilit Kontrolü
        if (!kilitli) {
           const butunKilitler = Object.values(kilitliSlotlar).filter(v => v.gun === g && v.saat === s);
           for (const kv of butunKilitler) {
              if (aktifSekme === "ogretmen" && kv.tip === "sinif") { // Sadece Sınıf kilitlerini hocalara yansıt
                 const hedef = (window._dersYukuSatirlar || []).find(r =>
                    (r.Sinif || r.Sınıf || "").split("+").map(x => x.trim()).includes(kv.isim) &&
                    (r["Ders Adı"] || r["Ders Adi"]) === kv.ders
                 );
                 if (hedef && (!kv.kilitliOgr || String(kv.kilitliOgr).split('+').map(x=>x.trim()).includes(isim))) {

// DÜZELTİLMİŞ KİLİTKAYDET (öğretmen limit kontrolü eklendi, continue kullanıldı)
function kilitKaydet(kilitKey, isim, g, s, btn){
  const ders = document.getElementById("kilit-ders").value;
  if(!ders) return bildir("Ders seçin.","uyari");

  // Arayüzden seçilen öğretmen veya sınıf bilgisini alıyoruz
  const ogrSelEl = document.getElementById("kilit-ogr-sel");
  const secilenOgr = (ogrSelEl && ogrSelEl.closest('[style*="flex"]')) ? ogrSelEl.value : "";
  
  const snfSelEl = document.getElementById("kilit-snf-sel");
  const secilenSnf = (snfSelEl && snfSelEl.closest('[style*="flex"]')) ? snfSelEl.value : "";
  
  const satirlar = window._dersYukuSatirlar || [];
  
  // Excel'deki ilgili satırı buluyoruz (Bu kısım hatasız hale getirildi)
  const satir = satirlar.find(row => {
    const snf = String(row["Sinif"]||row["Sınıf"]||"");
    const ogr = String(row["Ogretmen"]||row["Öğretmen"]||"");
    const rd = String(row["Ders Adı"]||row["Ders Adi"]||"");
    if(rd !== ders) return false;
    
    // Aktif sekmeye göre doğru eşleşmeyi bul
    if(aktifSekme === "sinif") {
      return snf.split("+").map(x=>x.trim()).includes(isim) && (!secilenOgr || ogr.split("+").map(x=>x.trim()).includes(secilenOgr));
    }
    if(aktifSekme === "ogretmen") {
      return ogr.split("+").map(x=>x.trim()).includes(isim) && (!secilenSnf || snf.split("+").map(x=>x.trim()).includes(secilenSnf));
    }
    return false;
  });

  if(!satir) return bildir("Uygun ders kaydı bulunamadı.","hata");

  // Haftalık saat limit kontrolü
  const limit = parseInt(satir["Haftalik Saat"]||satir["Haftalık Saat"]||0);
  const snfGrupLimitIcin = String(satir["Sinif"]||satir["Sınıf"]||"").split("+").map(x=>x.trim()).filter(Boolean);
  const mevcut = Object.values(kilitliSlotlar).filter(k => {
       if (k.tip !== aktifSekme || k.isim !== isim || k.ders !== ders) return false;
       if (aktifSekme === "ogretmen") {
           const hedefSnf = secilenSnf || snfGrupLimitIcin[0];
           if (hedefSnf) return k.siniflar && k.siniflar.includes(hedefSnf);
       }
       return true;
     }).length;
     if(mevcut + 1 > limit) return bildir(`⚠️ Limit (${limit} saat) aşılıyor!`,"hata");

     // Kilitleri uygula ve aynala (Birleşik sınıflar/öğretmenler dahil)
     const snfGrup = String(satir["Sinif"]||satir["Sınıf"]||"").split("+").map(x=>x.trim()).filter(Boolean);
     const ogrGrup = String(satir["Ogretmen"]||satir["Öğretmen"]||"").split("+").map(x=>x.trim()).filter(Boolean);

// 1. SINIF KİLİDİ (Hocadan geliyorsa tek sınıf, sınıftan geliyorsa grup kilitlenir)
(aktifSekme === 'ogretmen' ? [secilenSnf || snfGrup[0]] : snfGrup).forEach(snf => { 
  kilitliSlotlar[`sinif:${snf}:${g}_${s}`] = { 
     isim: snf, gun: g, saat: s, ders, tip: "sinif", 
     siniflar: snfGrup, 
     kilitliOgr: ogrGrup.join(' + ') 
   }; 
 });

  // 2. ÖĞRETMEN KİLİDİ (Tüm birleşik öğretmenleri aynı anda kilitler)
  ogrGrup.forEach(ogr => { 
    kilitliSlotlar[`ogretmen:${ogr}:${g}_${s}`] = { 
      isim: ogr, gun: g, saat: s, ders, tip: "ogretmen", 
      siniflar: snfGrup 
    }; 
  });
 
  // Pencereyi kapat ve ekranı yenile
  const overlay = btn.closest('[style*="position:fixed"]');
  if(overlay) overlay.remove();
  gridYenile(); 
  degisiklikIsaretle();
  bildir(`🔒 ${isim} → ${ders} kilitlendi.`,"basari");
}

      <option value="ayni_gun">Aynı Gün</option>
    </select>
    <button onclick="this.parentElement.remove(); degisiklikIsaretle();" style="border:none; background:none; color:var(--red); cursor:pointer;">🗑️</button>
  `;
  
  if(ders1) div.querySelector(".d1").value = ders1;
  if(ders2) div.querySelector(".d2").value = ders2;
  if(tip) div.querySelector(".tip").value = tip;
  
  div.querySelectorAll("select").forEach(s => s.addEventListener("change", degisiklikIsaretle));
  liste.appendChild(div);
  degisiklikIsaretle();
}

function iliskileriTopla() {
  let kurallar = [];
  document.querySelectorAll(".iliski-satiri").forEach(satir => {
    let d1 = satir.querySelector(".d1").value;
    let d2 = satir.querySelector(".d2").value;
    let tip = satir.querySelector(".tip").value;
    if(d1 && d2 && d1 !== d2) {
      kurallar.push({ ders1: d1, ders2: d2, tip: tip });
    }
  });
  return kurallar;
}

yukle();
</script>
